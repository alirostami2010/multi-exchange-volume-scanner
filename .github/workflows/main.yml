
name: Gate API Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Gate.io Futures API
        run: |
          set -e

          echo "Testing futures contracts..."
          curl -fsS "https://api.gateio.ws/api/v4/futures/usdt/contracts" | jq '.[0]'

          echo "Testing futures tickers..."
          curl -fsS "https://api.gateio.ws/api/v4/futures/usdt/tickers" | jq '.[0]'

          echo "Testing 1m candles..."
          curl -fsS "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=1m&limit=3" | jq '.'

          echo "GATE API TEST SUCCESSFUL"
