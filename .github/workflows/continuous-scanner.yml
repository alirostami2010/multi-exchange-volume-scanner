name: Continuous Gate Scanner

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: continuous-gate-scanner-chain
  cancel-in-progress: false

jobs:
  scan:
    uses: ./.github/workflows/scanner.yml
    secrets: inherit

  restart:
    name: Wait and request next scan
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait 1 minutes
        run: sleep 60

      - name: Start next execution
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "continuous-scanner.yml",
              ref: "main"
            });

            console.log("Next scanner execution requested on main.");
