name: Continuous Gate Scanner

on:
  workflow_dispatch:

concurrency:
  group: continuous-gate-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Repeat scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          for i in {1..22}; do
            echo "Starting scan $i of 22"
            npm start || echo "Scan $i failed"
            if [ "$i" -lt 22 ]; then
              echo "Waiting 7 minutes..."
              sleep 420
            fi
          done
