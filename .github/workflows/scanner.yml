name: Gate Scanner and Paper Performance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    concurrency:
      group: gate-scanner-shared-state
      cancel-in-progress: false

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-fund

      - name: Check syntax
        run: npm run check

      - name: Run evaluator tests
        run: npm test

      - name: Scan and update paper performance
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Back up local data as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save scanner and tracking data with retries
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d .git ]; then
            echo "Repository is unavailable; cannot persist data."
            exit 1
          fi

          mkdir -p data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          find data -maxdepth 1 -type f -name '*.json' \
            -exec git add -- {} +

          if git diff --cached --quiet; then
            echo "No data changes to save."
            exit 0
          fi

          git commit -m "Update scanner and paper evaluation data"

          # Keep this commit limited to scanner data.
          # npm install may have modified tracked dependency files.
          git restore --worktree -- package.json

          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            git restore --worktree -- package-lock.json
          fi

          MAX_ATTEMPTS=6
          DELAY=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "Persistence attempt ${attempt}/${MAX_ATTEMPTS}"

            if git fetch origin main; then
              # Refuse to overwrite concurrent changes.
              if ! git rebase origin/main; then
                git rebase --abort || true

                echo "::error::Rebase conflict or failure. Remote data will not be overwritten."
                echo "Use the uploaded artifact to inspect and recover local data."
                exit 1
              fi

              if git push origin HEAD:main; then
                echo "Scanner and tracking data saved successfully."
                exit 0
              fi

              echo "::warning::Push failed. A retry may recover from a temporary GitHub error."
            else
              echo "::warning::Fetch failed. Waiting before retry."
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Waiting ${DELAY} seconds..."
              sleep "$DELAY"
              DELAY=$((DELAY * 2))
            fi
          done

          echo "::error::Unable to persist data after all attempts."
          echo "The continuous chain will stop to avoid using stale tracking state."
          echo "Inspect the data backup artifact before restarting."
          exit 1
