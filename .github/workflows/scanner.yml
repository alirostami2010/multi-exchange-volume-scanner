
name: Gate.io Early Bullish Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */4 * * *"

concurrency:
  group: accumulation-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run Early Bullish Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/scanner/marketScanner.js

      - name: Save Market Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/market-state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update market scanner data"
            git push
          else
            echo "No market data changes to save."
          fi
